## P4 目标: WiFi 走 ESP32-C6 协处理器 (ESP-Hosted/SDIO)
## 版本与微雪官方 04_wifistation 示例一致 (IDF >= 6.0)
dependencies:
  idf: ">=6.0.0"
  # cJSON: IDF v6.0+ 内置 json 组件已移除, 改用官方托管组件 espressif/cjson
  # (CMake 组件名 espressif__cjson, 供天气服务解析 wttr.in JSON;
  #  所有目标统一获取, 非 P4 目标仅 stub 不使用)
  espressif/cjson: "^1.7.19~2"
  espressif/esp_wifi_remote:
    version: ">=1.6,<2.0"
    rules:
      - if: "target == esp32p4"
  espressif/esp_hosted:
    version: ">=2.12,<3.0"
    rules:
      - if: "target == esp32p4"

dependencies:
  idf:
    version: '>=5.5'

  chmorgan/esp-audio-player:
    version: 1.1.0
    public: true

  chmorgan/esp-file-iterator:
    version: 1.0.0
    public: true

  # 固定到工厂快照时代的版本: 浮动解析的新版与 board 组件代码的 API 预期不符
  # (CI run 44891983365)
  espressif/esp_board_manager:
    version: ==0.7.5
    public: true

  # board 组件代码直接 include esp_codec_dev.h (音频编解码器), 但清单未声明:
  # 工厂构建靠锁文件里的可选依赖带入, 全新解析会被跳过
  # ("Skipping optional dependency", CI 44904312871). 显式声明保证入图.
  espressif/esp_codec_dev:
    version: ^1.3.0
    public: true

  espressif/esp_lvgl_adapter:
    version: ^0.7.3~1
    public: true

  espressif/esp_wifi_service:
    version: ^0.5.3
    public: true

  # Co-processor firmware version query; main/idf_component.yml pins the exact release.
  espressif/esp_hosted:
    version: ^1.4.7
    public: true

  espressif/esp_wifi_remote:
    version: 0.14.5
    public: true

description: Board support layer on esp_board_manager for ESP32-P4-WIFI6-Touch-LCD-XC
targets:
- esp32p4
version: 0.0.2

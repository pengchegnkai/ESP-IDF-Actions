dependencies:
  idf:
    version: '>=5.5'

  chmorgan/esp-audio-player:
    version: 1.1.0
    public: true

  chmorgan/esp-file-iterator:
    version: 1.0.0
    public: true

  # board 组件代码使用 devices/ 设备抽象层 (dev_audio_codec / dev_display_lcd /
  # periph_ledc 等类型), 0.7.5 没有这层 (CI 44911371483 编译失败).
  # 放宽到 >=0.7.5, 注册表按 IDF 约束自动选最新兼容版本.
  espressif/esp_board_manager:
    version: ">=0.7.5"
    public: true

  # board 组件代码直接使用 esp_codec_dev 2.x API (esp_codec_dev.h /
  # esp_codec_dev_open 等), 且 esp_board_manager 0.7.6 的条件依赖也要求
  # ^2.0.0-beta4 (DEV_AUDIO_CODEC_SUPPORT 时). 1.x 的 audio_codec_new 已改名
  # (audio_codec_new_gpio), 版本错配导致 dev_audio_codec.c 编译失败
  # (CI 44917352932). 显式声明保证入图并与 esp_board_manager 对齐.
  espressif/esp_codec_dev:
    version: ^2.0.0-beta4
    public: true

  espressif/esp_lvgl_adapter:
    version: ^0.7.3~1
    public: true

  espressif/esp_wifi_service:
    version: ^0.5.3
    public: true

  # Co-processor firmware version query; main/idf_component.yml pins the exact release.
  espressif/esp_hosted:
    version: ^1.4.7
    public: true

  espressif/esp_wifi_remote:
    version: 0.14.5
    public: true

description: Board support layer on esp_board_manager for ESP32-P4-WIFI6-Touch-LCD-XC
targets:
- esp32p4
version: 0.0.2

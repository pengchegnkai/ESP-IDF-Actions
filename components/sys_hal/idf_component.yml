## 微雪 ESP32-P4-WIFI6-Touch-LCD-4.3 官方 BSP (ST7701 面板 + GT911 触摸 + LVGL 适配)
## 与 esp_codec_dev (ES8311/ES7210 音频驱动) 仅 P4 目标拉取; S3/C6 目标构建时自动跳过
dependencies:
  waveshare/esp32_p4_wifi6_touch_lcd_4_3:
    version: "^1.0.1"
    rules:
      - if: "target == esp32p4"
  espressif/esp_codec_dev:
    version: "^1.4.0"
    rules:
      - if: "target == esp32p4"
  espressif/esp_tinyusb:
    version: "^2.2.1"
    rules:
      - if: "target == esp32p4"
  espressif/tinyusb:
    version: ">=0.17"
    rules:
      - if: "target == esp32p4"

name: Diag registry

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Dump component registry manifests
        run: |
          python3 - <<'EOF'
          import json, urllib.request
          def get(name):
              url = f"https://api.components.espressif.com/components/espressif/{name}"
              req = urllib.request.Request(url, headers={"User-Agent": "ci-diag"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          # 1) esp_board_manager: 0.7.5 的依赖清单 (可选依赖在这里)
          d = get("esp_board_manager")
          vers = d.get("versions", [])
          print("esp_board_manager versions:", [v["version"] for v in vers][:15])
          for v in vers:
              if v["version"] == "0.7.5":
                  m = v.get("manifest", {})
                  print("=== esp_board_manager 0.7.5 dependencies ===")
                  print(json.dumps(m.get("dependencies", {}), indent=1)[:6000])
                  break
          # 2) esp_codec_dev: 版本列表
          try:
              d2 = get("esp_codec_dev")
              v2 = d2.get("versions", [])
              print("esp_codec_dev versions:", [v["version"] for v in v2][:15])
              if v2:
                  m2 = v2[0].get("manifest", {})
                  print("esp_codec_dev latest manifest idf:", m2.get("dependencies", {}).get("idf"))
          except Exception as e:
              print("esp_codec_dev FETCH FAILED:", e)
          # 3) esp-dev 是否存在
          try:
              d3 = get("esp-dev")
              v3 = d3.get("versions", [])
              print("esp-dev versions:", [v["version"] for v in v3][:10])
          except Exception as e:
              print("esp-dev FETCH FAILED (组件可能不存在):", e)
          EOF

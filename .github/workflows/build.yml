name: Build ESP-IDF

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: '目标芯片 (只编译选中的这一款)'
        required: true
        default: 'esp32p4'
        type: choice
        options:
          - esp32p4
          - esp32c6
          - esp32s3

env:
  # ESP-IDF 版本，改这一处即可（如 v5.4、v5.5.1、release/v5.5）
  IDF_VERSION: v6.1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 手动触发: 编译用户选择的芯片; push/PR: 只编译默认主控芯片 esp32p4
        # 注意: strategy 中不能用 env 上下文, 默认值必须写成字面量
        target: ${{ fromJSON(format('["{0}"]',
                  github.event_name == 'workflow_dispatch' && inputs.target || 'esp32p4')) }}

    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF
        run: |
          set -o pipefail
          docker run --rm -v "$PWD":/project -w /project \
            -e IDF_TARGET=${{ matrix.target }} \
            espressif/idf:${{ env.IDF_VERSION }} \
            bash -c "source /opt/esp/idf/export.sh >/dev/null 2>&1 && idf.py build" 2>&1 | tee build_log.txt

      - name: Report compile errors
        if: failure()
        run: grep -inE "error:|fatal error|FAILED" build_log.txt | head -40 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.target }}
          path: build_log.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/flasher_args.json
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error

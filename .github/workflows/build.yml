name: Build ESP-IDF

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  # Brookesia 工厂基座要求 IDF >=5.5,<6.0 (main/idf_component.yml)
  # 工厂 CI 双跑 v5.5.5 / v6.0.2, 此处用工厂默认 v5.5.5
  IDF_VERSION: v5.5.5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF (rev3_x silicon profile)
        run: |
          set -o pipefail
          docker run --rm -v "$PWD":/project -w /project \
            -e IDF_TARGET=esp32p4 \
            espressif/idf:${{ env.IDF_VERSION }} \
            bash -c "source /opt/esp/idf/export.sh >/dev/null 2>&1 && idf.py -D SDKCONFIG_DEFAULTS=\"sdkconfig.defaults;sdkconfig.defaults.rev3_x\" build && idf.py merge-bin" 2>&1 | tee build_log.txt

      - name: Report compile errors
        if: failure()
        run: |
          echo "=== log size: $(wc -l < build_log.txt) lines ==="
          grep -inE "error|failed|FAILED|killed|no space|fatal|undefined reference|ninja" build_log.txt | head -40 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: Upload merged flash image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: merged-flash
          path: build/merged-binary.bin
          if-no-files-found: error

      - name: Publish release asset
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (esp32p4, brookesia base)
          files: build/merged-binary.bin
          fail_on_unmatched_files: true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/flasher_args.json
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error

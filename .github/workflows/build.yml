name: Build ESP-IDF

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: '目标芯片 (只编译选中的这一款)'
        required: true
        default: 'esp32p4'
        type: choice
        options:
          - esp32p4
          - esp32c6
          - esp32s3

env:
  # ESP-IDF 版本，改这一处即可（如 v5.4、v5.5.1、release/v5.5）
  IDF_VERSION: v6.1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 手动触发: 编译用户选择的芯片; push/PR: 只编译默认主控芯片 esp32p4
        # 注意: strategy 中不能用 env 上下文, 默认值必须写成字面量
        target: ${{ fromJSON(format('["{0}"]',
                  github.event_name == 'workflow_dispatch' && inputs.target || 'esp32p4')) }}

    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ matrix.target }}
          path: '.'

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/flasher_args.json
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error

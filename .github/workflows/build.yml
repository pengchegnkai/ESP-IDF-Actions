name: Build ESP-IDF

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  # Brookesia 工厂基座要求 IDF >=5.5,<6.0 (main/idf_component.yml)
  # 工厂 CI 双跑 v5.5.5 / v6.0.2, 此处用工厂默认 v5.5.5
  IDF_VERSION: v5.5.5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ESP-IDF (rev3_x silicon profile + bmgr board gen)
        run: |
          set -o pipefail
          docker run --rm -v "$PWD":/project -w /project \
            -e IDF_TARGET=esp32p4 \
            -e SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.rev3_x" \
            espressif/idf:${{ env.IDF_VERSION }} \
            bash -c "source /opt/esp/idf/export.sh >/dev/null 2>&1 && \
              python -m pip install -q esp-bmgr-assist==0.8.3 && \
              idf.py reconfigure && \
              idf.py bmgr -b esp32_p4_wifi6_touch_lcd_4_3 && \
              idf.py build && idf.py merge-bin" 2>&1 | tee build_log.txt

      # 临时诊断: 组件管理器已把 esp_board_manager 0.7.5 下载到 managed_components/
      # (runner 宿主机 DNS 解析不了注册表域名, 但 docker 容器内可以).
      # 把它的完整清单+头文件+锁文件打包上传, 用于定位缺失的可选依赖. 确认后移除.
      - name: Save esp_board_manager dump (diag)
        if: always()
        run: |
          mkdir -p diag_dump
          cp dependencies.lock diag_dump/ 2>/dev/null || true
          cp sdkconfig diag_dump/ 2>/dev/null || true
          cp -r managed_components/espressif__esp_board_manager diag_dump/ 2>/dev/null || true
          cp -r components/gen_bmgr_codes diag_dump/ 2>/dev/null || true
          ls -R diag_dump | head -80
      - name: Upload diag dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-dump
          path: diag_dump/
          if-no-files-found: warn

      - name: Report compile errors
        if: failure()
        run: |
          echo "=== log size: $(wc -l < build_log.txt) lines ==="
          grep -inE "error|failed|FAILED|killed|no space|fatal|undefined reference|ninja" build_log.txt | head -40 | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: Upload merged flash image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: merged-flash
          path: build/merged-binary.bin
          if-no-files-found: error

      - name: Publish release asset
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (esp32p4, brookesia base)
          files: build/merged-binary.bin
          fail_on_unmatched_files: true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/flasher_args.json
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
          if-no-files-found: error
